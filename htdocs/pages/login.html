<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, hsl(236, 90%, 33%), lab(17.89% 52.32 -72.14));
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      margin: 50;
    }

body::before {
      content: "";
      position: absolute;
      bottom: -300px;
      left: 50%;
      width: 1500px;
      height: 800px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        oklab(48.019% 0.10824 -0.2361) 0%,
        rgba(255, 255, 255, 0) 70%
      );
      filter: blur(80px);
      z-index: -1;
    }


    .login-box {
      background: #6ee9ee;
      padding: 50px;
      border-radius: 25px;
      box-shadow: 0 15px 20px rgba(8, 157, 195, 0.877);
      width: 500px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #555;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 50%;
      padding: 10px;
      background-color: #cb0de4;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: block;           
      margin: 0 auto; 
    }
    
    button:hover {
      background-color: #a237dc;
    }
    .note {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
    .note a {
      color: #835454;
      text-decoration: none;
    }

      .logo {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 100px;
      }

  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Sign In</button>
    </form>
    <div class="note">
      Don't have an account? <a href="">Register</a>
    </div>
  </div>

  <div class="logo">
    <img src="../resources/img/Coperight.png" alt="My Logo" width="150" height="auto">  
  </div>
</body>
</html>
